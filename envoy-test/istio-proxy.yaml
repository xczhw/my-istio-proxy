apiVersion: v1
kind: Pod
metadata:
  name: istio-proxy-manual
  namespace: test
spec:
  containers:
  - name: istio-proxy
    image: node0:5000/proxyv2:1.24-dev
    command: ["sleep", "3600"]
    resources:
      limits:
        cpu: "2"
        memory: "1Gi"
      requests:
        cpu: "10m"
        memory: "40Mi"

